version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/app.Dockerfile
    volumes:
      - ..:/workspaces/lab:cached
      - nuget-packages:/root/.nuget/packages
    working_dir: /workspaces/lab/personapi-dotnet
    command: /bin/bash -c "dotnet build && nohup dotnet run --urls http://0.0.0.0:5000 > /tmp/app.log 2>&1 & sleep infinity"
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: 1.5

  db:
    build:
      context: ..
      dockerfile: .devcontainer/db.Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ../scripts:/scripts:ro
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Admin123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  nuget-packages:
  sql-data:
